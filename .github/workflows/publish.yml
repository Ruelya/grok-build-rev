# Build native binaries (win/linux/mac-arm) → GitHub Release assets
# + publish thin @ruelya/grok-build npm installer (downloads assets on install).
#
# npm Trusted Publisher (OIDC). No fat binary in the tarball (avoids E413).
# Version conflicts: auto patch-bump and retry.

name: publish

# Auto CI disabled — binaries are built and released locally (see npm/scripts/release-local.sh).
# Keep workflow_dispatch only if someone wants to re-enable remote builds later.
on:
  workflow_dispatch:
    inputs:
      force_version:
        description: Optional exact version (empty = auto)
        required: false
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: "@ruelya/grok-build"

jobs:
  # win32-x64 | linux-x64 | darwin-arm64  (no Intel macOS)
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            key: win32-x64
            exe: xai-grok-pager.exe
            asset: grok-win32-x64.exe
          - os: ubuntu-latest
            key: linux-x64
            exe: xai-grok-pager
            asset: grok-linux-x64
          - os: macos-latest
            key: darwin-arm64
            exe: xai-grok-pager
            asset: grok-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pager-${{ matrix.key }}
          cache-on-failure: true

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p xai-grok-pager-bin --release
          mkdir -p dist
          cp -f "target/release/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}" || true
          ls -la "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.key }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@ruelya"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/bins
          pattern: bin-*

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          for dir in /tmp/bins/bin-*; do
            f=$(find "$dir" -type f | head -1)
            name=$(basename "$f")
            cp -f "$f" "/tmp/release-assets/$name"
            chmod +x "/tmp/release-assets/$name" || true
            echo "asset $name ($(wc -c < "/tmp/release-assets/$name") bytes)"
          done
          ls -la /tmp/release-assets
          test -f /tmp/release-assets/grok-win32-x64.exe
          test -f /tmp/release-assets/grok-linux-x64
          test -f /tmp/release-assets/grok-darwin-arm64

      - name: Resolve version
        id: ver
        working-directory: npm
        env:
          FORCE: ${{ inputs.force_version }}
        shell: bash
        run: |
          set -euo pipefail
          NAME='@ruelya/grok-build'
          if [[ -n "${FORCE:-}" ]]; then
            VER="$FORCE"
          else
            LATEST=$(npm view "$NAME" version 2>/dev/null || true)
            if [[ -z "$LATEST" ]]; then
              VER=$(node -p "require('./package.json').version")
            else
              IFS=. read -r MA MI PA <<<"$LATEST"
              PA=${PA%%[^0-9]*}
              VER="${MA}.${MI}.$((PA+1))"
            fi
          fi
          # Write package.json version + release base for the thin installer
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VER}"
          VER="$VER" BASE="$BASE" node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            p.name="@ruelya/grok-build";
            p.version=process.env.VER;
            p.forkReleaseBase=process.env.BASE;
            p.publishConfig={access:"public",registry:"https://registry.npmjs.org/"};
            // thin package: no native bins in tarball
            p.files=(p.files||[]).filter(f => !String(f).includes("artifacts/bin"));
            fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");
            console.log(p.name, p.version, p.forkReleaseBase);
          '
          # working-directory is npm/
          mkdir -p artifacts
          {
            echo "package: @ruelya/grok-build"
            echo "version: ${VER}"
            echo "git: ${GITHUB_SHA}"
            echo "release: ${BASE}"
            date -u +%Y-%m-%dT%H:%M:%SZ
            ls -la /tmp/release-assets
          } > artifacts/BUILD_INFO.txt
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release (binaries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VER}"
          NOTES="Install: npm install -g @ruelya/grok-build@${VER} | Assets: grok-win32-x64.exe, grok-linux-x64, grok-darwin-arm64 (no Intel macOS) | SHA: ${GITHUB_SHA}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/release-assets/* \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" /tmp/release-assets/* \
              --repo "${{ github.repository }}" \
              --title "@ruelya/grok-build ${VER}" \
              --notes "$NOTES"
          fi

      - name: npm publish thin installer (Trusted Publisher)
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          # Ensure we never ship multi-hundred-MB bins
          rm -rf artifacts/bin artifacts/cache || true
          for i in $(seq 1 20); do
            VER=$(node -p "require('./package.json').version")
            echo "publish attempt $i: @ruelya/grok-build@$VER"
            set +e
            out=$(npm publish --access public --provenance 2>&1)
            code=$?
            set -e
            echo "$out"
            if [[ $code -eq 0 ]]; then
              echo "OK @ruelya/grok-build@$VER"
              exit 0
            fi
            if echo "$out" | grep -qiE 'cannot publish over|EPUBLISHCONFLICT|previously published|version already exists|403 Forbidden'; then
              echo "version conflict — patch bump"
              npm version patch --no-git-tag-version
              # keep forkReleaseBase in sync with new version
              V2=$(node -p "require('./package.json').version")
              node -e "
                const fs=require('fs');
                const p=JSON.parse(fs.readFileSync('package.json','utf8'));
                p.forkReleaseBase='https://github.com/${{ github.repository }}/releases/download/v'+p.version;
                fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
              "
              # create matching empty? No — binaries already on previous tag only.
              # For patch-after-conflict, re-upload assets under new tag.
              TAG="v${V2}"
              NOTES="patch retry ${V2}"
              gh release create "$TAG" /tmp/release-assets/* \
                --repo "${{ github.repository }}" \
                --title "@ruelya/grok-build ${V2}" \
                --notes "$NOTES" || \
              gh release upload "$TAG" /tmp/release-assets/* \
                --repo "${{ github.repository }}" --clobber
              continue
            fi
            echo "publish failed (non-conflict)"
            exit "$code"
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
