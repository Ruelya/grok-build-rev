# Publish @ruelya/grok-build with npm Trusted Publisher (OIDC).
# No NPM_TOKEN. Configure Trusted Publisher on npmjs for this repo + workflow.
# Version conflicts: auto patch-bump and retry.
#
# darwin-x64: cross-compile from macos-latest (arm64) via x86_64-apple-darwin.
# Avoids scarce/queued macos-13 Intel runners.

name: publish

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: Optional exact version (empty = auto)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - npm/**
      - crates/codegen/xai-grok-pager/**
      - crates/codegen/xai-grok-pager-bin/**
      - crates/codegen/xai-grok-version/**
      - Cargo.toml
      - Cargo.lock
      - third_party/async-openai/**
      - .github/workflows/publish.yml

concurrency:
  group: publish-npm
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            key: win32-x64
            rust_target: ""
            exe: xai-grok-pager.exe
            out: grok.exe
          - os: ubuntu-latest
            key: linux-x64
            rust_target: ""
            exe: xai-grok-pager
            out: grok
          # Apple Silicon host — native arm64 binary
          - os: macos-latest
            key: darwin-arm64
            rust_target: ""
            exe: xai-grok-pager
            out: grok
          # Same arm64 host — cross-compile Intel Mac (no macos-13)
          - os: macos-latest
            key: darwin-x64
            rust_target: x86_64-apple-darwin
            exe: xai-grok-pager
            out: grok
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pager-${{ matrix.key }}
          cache-on-failure: true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.rust_target }}"
          if [[ -n "$TARGET" ]]; then
            cargo build -p xai-grok-pager-bin --release --target "$TARGET"
            SRC="target/${TARGET}/release/${{ matrix.exe }}"
          else
            cargo build -p xai-grok-pager-bin --release
            SRC="target/release/${{ matrix.exe }}"
          fi
          mkdir -p "npm/artifacts/bin/${{ matrix.key }}"
          cp -f "$SRC" "npm/artifacts/bin/${{ matrix.key }}/${{ matrix.out }}"
          chmod +x "npm/artifacts/bin/${{ matrix.key }}/${{ matrix.out }}" || true
          file "npm/artifacts/bin/${{ matrix.key }}/${{ matrix.out }}" || true
          ls -la "npm/artifacts/bin/${{ matrix.key }}/${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: grok-${{ matrix.key }}
          path: npm/artifacts/bin/${{ matrix.key }}/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@ruelya"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/grok-bins
          pattern: grok-*

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          for dir in /tmp/grok-bins/grok-*; do
            key="${dir##*/grok-}"
            mkdir -p "npm/artifacts/bin/${key}"
            if [[ "$key" == win32-* ]]; then name=grok.exe; else name=grok; fi
            f=$(find "$dir" -type f | head -1)
            cp -f "$f" "npm/artifacts/bin/${key}/$name"
            chmod +x "npm/artifacts/bin/${key}/$name" || true
            echo "staged $key"
          done
          {
            echo "package: @ruelya/grok-build"
            echo "git: ${GITHUB_SHA}"
            date -u +%Y-%m-%dT%H:%M:%SZ
            ls -la npm/artifacts/bin/*/grok* || true
          } > npm/artifacts/BUILD_INFO.txt

      - name: Set package version
        working-directory: npm
        env:
          FORCE: ${{ inputs.force_version }}
        shell: bash
        run: |
          set -euo pipefail
          NAME='@ruelya/grok-build'
          if [[ -n "${FORCE:-}" ]]; then
            VER="$FORCE"
          else
            LATEST=$(npm view "$NAME" version 2>/dev/null || true)
            if [[ -z "$LATEST" ]]; then
              VER=$(node -p "require('./package.json').version")
            else
              IFS=. read -r MA MI PA <<<"$LATEST"
              PA=${PA%%[^0-9]*}
              VER="${MA}.${MI}.$((PA+1))"
            fi
          fi
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name='@ruelya/grok-build';
            p.version=process.argv[1];
            p.publishConfig={access:'public',registry:'https://registry.npmjs.org/'};
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            console.log(p.name, p.version);
          " "$VER"

      - name: npm publish (Trusted Publisher)
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          # OIDC Trusted Publisher — do not set NODE_AUTH_TOKEN
          for i in $(seq 1 20); do
            VER=$(node -p "require('./package.json').version")
            echo "publish attempt $i: @ruelya/grok-build@$VER"
            set +e
            out=$(npm publish --access public --provenance 2>&1)
            code=$?
            set -e
            echo "$out"
            if [[ $code -eq 0 ]]; then
              echo "OK @ruelya/grok-build@$VER"
              echo "PUBLISHED_VERSION=$VER" >> "$GITHUB_ENV"
              exit 0
            fi
            if echo "$out" | grep -qiE 'cannot publish over|EPUBLISHCONFLICT|previously published|version already exists|403 Forbidden'; then
              echo "version conflict on $VER — patch bump"
              npm version patch --no-git-tag-version
              continue
            fi
            echo "publish failed (non-conflict)"
            exit "$code"
          done
          exit 1

      - name: GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail
          VER="${PUBLISHED_VERSION:-$(node -p "require('./package.json').version")}"
          TAG="v${VER}"
          npm pack
          TGZ=$(ls ./*.tgz | head -1)
          NOTES="Install: npm install -g @ruelya/grok-build@${VER} | SHA: ${GITHUB_SHA}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$TGZ" \
              --repo "${{ github.repository }}" \
              --title "@ruelya/grok-build ${VER}" \
              --notes "$NOTES"
          fi
