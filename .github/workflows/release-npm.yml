# Thin npm publish only (no compile).
# Assumes GitHub Release v${version} already has the three binaries.
# Auth: NPM_TOKEN (Automation). Provenance via OIDC when available.

name: release-npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match an existing Release tag vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@ruelya"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Prepare thin package
        working-directory: npm
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VER}"
          # Verify release assets exist
          for need in grok-win32-x64.exe grok-linux-x64 grok-darwin-arm64; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 "${BASE}/${need}" || true)
            echo "$need → HTTP $code"
            if [[ "$code" != "200" && "$code" != "206" ]]; then
              echo "::error::Missing release asset ${BASE}/${need}"
              exit 1
            fi
          done
          VER="$VER" BASE="$BASE" node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            p.name="@ruelya/grok-build";
            p.version=process.env.VER;
            p.forkReleaseBase=process.env.BASE;
            p.publishConfig={access:"public",registry:"https://registry.npmjs.org/"};
            p.files=(p.files||[]).filter(f=>!String(f).includes("artifacts/bin"));
            fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");
            console.log(p.name, p.version, p.forkReleaseBase);
          '
          mkdir -p artifacts
          rm -rf artifacts/bin artifacts/cache
          echo "version=${VER}" > artifacts/BUILD_INFO.txt
          echo "release=${BASE}" >> artifacts/BUILD_INFO.txt
          npm pack
          SIZE=$(wc -c < ./*.tgz | tr -d ' ')
          echo "tgz size=$SIZE"
          if [[ "$SIZE" -gt 10485760 ]]; then
            echo "::error::tarball too large"
            exit 1
          fi
          rm -f ./*.tgz

      - name: npm publish
        working-directory: npm
        env:
          # Prefer Automation token (repo secret NPM_TOKEN). OIDC Trusted
          # Publisher alone returned ENEEDAUTH on this package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Missing secret NPM_TOKEN (npm Automation token required for agent-driven release)"
            exit 1
          fi
          # --provenance needs OIDC; try with, fall back without if token path
          set +e
          out=$(npm publish --access public --provenance 2>&1)
          code=$?
          set -e
          echo "$out"
          if [[ $code -ne 0 ]]; then
            if echo "$out" | grep -qiE 'provenance|OIDC|id-token'; then
              echo "retry without --provenance"
              npm publish --access public
            else
              exit "$code"
            fi
          fi
          VER=$(node -p "require('./package.json').version")
          echo "Published @ruelya/grok-build@$VER"
