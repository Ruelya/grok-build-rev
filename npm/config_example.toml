# -----------------------------------------------------------------------------
# Themes (files, not config keys)
# Place TOML under ~/.grok/themes/<name>.toml then:
#   /theme <name>
#   [ui] theme = "<name>"
# Required key: base = "groknight" | "grokday" | "tokyonight" | …
# Color keys: bg_base, bg_dark, bg_light, bg_highlight, bg_hover, bg_terminal,
#   text_primary, text_secondary, gray_dim, gray, gray_bright,
#   accent_user, accent_assistant, accent_thinking, accent_tool, accent_system,
#   accent_error, accent_success, accent_running, accent_skill,
#   command, path, running, warning, fuzzy_accent
# Packaged examples (no brand labels): Lonetrail, Lonetrail-light
# -----------------------------------------------------------------------------
