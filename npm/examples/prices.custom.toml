# =============================================================================
# Custom fallback prices (USD per 1M tokens)
# Point [usage.pricing] custom_prices_file at this path, e.g.:
#   custom_prices_file = "~/.grok/usage/prices.toml"
# Docs: docs/usage-pricing.md
# =============================================================================

# Used when no [models."…"] key matches the wire model id.
[default]
input = 1.0
output = 5.0
cache_read = 0.25

# Exact / substring match keys (case-insensitive; more specific wins).
[models."grok-4.5"]
input = 2.0
output = 6.0
cache_read = 0.30

[models."grok-4.5-build"]
input = 2.0
output = 6.0
cache_read = 0.30

[models."grok-build-0.1"]
input = 1.0
output = 2.0
cache_read = 0.20

[models."grok-4.3"]
input = 1.25
output = 2.50
cache_read = 0.20

# Example BYOK / proxy alias — set to what your gateway bills you.
[models."my-proxy-alias"]
input = 0.80
output = 3.20
cache_read = 0.10

